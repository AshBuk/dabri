name: Release Fedora

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      publish:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-srpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:45
    timeout-minutes: 30
    steps:
      # git goes first: without it checkout downloads a tarball with no .git for git archive
      - name: Install dependencies
        run: |
          dnf install -y git golang go-rpm-macros go-vendor-tools rpm-build rpmlint curl copr-cli glibc-langpack-en
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract version
        id: version
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          # v1.7.0-rc.1 -> 1.7.0: RPM and pacman versions cannot contain '-'
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION%%-rc.*}" >> $GITHUB_OUTPUT

      - name: Lint spec file
        run: |
          cp packaging/fedora/dabri.spec.in /tmp/dabri.spec
          rpmlint -r packaging/fedora/.rpmlintrc /tmp/dabri.spec

      - name: Create SRPM
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: packaging/fedora/create-srpm.sh

      - name: Upload SRPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: srpm
          path: ~/rpmbuild/SRPMS/*.src.rpm

      - name: Submit to COPR
        if: inputs.publish
        env:
          COPR_API_TOKEN: ${{ secrets.COPR_API_TOKEN }}
        run: |
          # Configure copr-cli
          mkdir -p ~/.config
          cat > ~/.config/copr <<EOF
          [copr-cli]
          copr_url = https://copr.fedorainfracloud.org
          login = ${{ secrets.COPR_LOGIN }}
          username = ${{ secrets.COPR_USERNAME }}
          token = ${COPR_API_TOKEN}
          EOF
          chmod 600 ~/.config/copr
          
          # Submit build
          SRPM=$(ls ~/rpmbuild/SRPMS/dabri-${{ steps.version.outputs.VERSION }}-1.*.src.rpm)
          copr-cli build dabri "$SRPM"
