name: Lint RPM

on:
  push:
    branches: [master, main]
    paths:
      - 'packaging/fedora/**'
  pull_request:
    paths:
      - 'packaging/fedora/**'

permissions:
  contents: read

jobs:
  rpmlint:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install rpmlint
        run: dnf install -y rpmlint glibc-langpack-en

      - name: Lint spec file
        run: |
          cp packaging/fedora/dabri.spec.in /tmp/dabri.spec
          rpmlint -r packaging/fedora/.rpmlintrc /tmp/dabri.spec
