name: Release Flatpak

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach the bundle. Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ggml's vulkan-shaders-gen forks a glslc per shader variant; on the 16 GB
      # x86_64 runner this can hit ENOMEM, and the generator silently skips the
      # failed variants, breaking the final link with undefined matmul_* symbols.
      # Swap absorbs the peak (aarch64 has fewer variants but it doesn't hurt).
      - name: Add swap for shader generation
        run: |
          sudo fallocate -l 8G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          free -h

      - name: Install flatpak and Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak dbus
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.flatpak.Builder

      - name: Build Flatpak
        run: |
          echo "=== Building Flatpak for ${{ matrix.arch }} (runtime/SDK pulled from Flathub) ==="
          dbus-run-session -- flatpak run org.flatpak.Builder \
            --user \
            --install-deps-from=flathub \
            --force-clean \
            --disable-rofiles-fuse \
            --default-branch=stable \
            --repo=repo \
            build-dir io.github.ashbuk.dabri.yml

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
          else
            # No tag context (plain manual build): fall back to the appdata version.
            VERSION="$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("io.github.ashbuk.dabri.appdata.xml").getroot().find("releases/release").attrib["version"])')"
          fi
          echo "bundle=dabri-${VERSION}-${{ matrix.arch }}.flatpak" >> "$GITHUB_OUTPUT"
          echo "Bundle name: dabri-${VERSION}-${{ matrix.arch }}.flatpak"

      - name: Bundle Flatpak
        run: |
          flatpak build-bundle repo "${{ steps.ver.outputs.bundle }}" io.github.ashbuk.dabri stable
          ls -lh "${{ steps.ver.outputs.bundle }}"

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: dabri-flatpak-${{ matrix.arch }}
          path: ${{ steps.ver.outputs.bundle }}

  release:
    needs: build-flatpak
    if: inputs.publish || inputs.release_tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Flatpak bundles
        uses: actions/download-artifact@v8
        with:
          pattern: dabri-flatpak-*
          merge-multiple: true
          path: dist

      - name: Attach Flatpak bundles to Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # Attach to the pushed tag, or to an existing release given via
          # workflow_dispatch (release_tag).
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*.flatpak
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
