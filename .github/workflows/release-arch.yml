name: Release Arch

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      publish:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract version
        id: version
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          # v1.7.0-rc.1 -> 1.7.0: RPM and pacman versions cannot contain '-'
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION%%-rc.*}" >> $GITHUB_OUTPUT

      - name: Update PKGBUILD version
        run: |
          cd packaging/arch
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.VERSION }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Update PKGBUILD checksums
        if: inputs.publish
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          WHISPER_VERSION=$(grep -E '^_whisper_version=' packaging/arch/PKGBUILD | cut -d= -f2)

          # Download main source and whisper.cpp
          curl -fsSL -o source.tar.gz \
            "https://github.com/AshBuk/dabri/archive/refs/tags/v${VERSION}.tar.gz"
          curl -fsSL -o whisper.tar.gz \
            "https://github.com/ggml-org/whisper.cpp/archive/refs/tags/v${WHISPER_VERSION}.tar.gz"

          sha() { sha256sum "$1" | cut -d' ' -f1; }
          sed -i "s/'SKIP'  # TODO: Update on release/'$(sha source.tar.gz)'/" packaging/arch/PKGBUILD
          sed -i "s/'SKIP'  # whisper.cpp checksum/'$(sha whisper.tar.gz)'/" packaging/arch/PKGBUILD

          rm -f source.tar.gz whisper.tar.gz

      - name: Generate .SRCINFO
        uses: docker://archlinux:latest
        with:
          entrypoint: /bin/bash
          args: |
            -c "
              pacman -Syu --noconfirm pacman-contrib
              useradd -m builder
              chown -R builder:builder packaging/arch
              cd packaging/arch
              su builder -c 'makepkg --printsrcinfo > .SRCINFO'
            "

      - name: Lint PKGBUILD
        uses: docker://archlinux:latest
        with:
          entrypoint: /bin/bash
          args: |
            -c "
              pacman -Syu --noconfirm namcap
              namcap packaging/arch/PKGBUILD
            "

      - name: Publish to AUR
        if: inputs.publish
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: dabri
          pkgbuild: packaging/arch/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.version.outputs.VERSION }}"
          force_push: false
