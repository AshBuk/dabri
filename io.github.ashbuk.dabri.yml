app-id: io.github.ashbuk.dabri
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: dabri

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=org.kde.StatusNotifierWatcher

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/cmake
  - /share/bash-completion
  - /share/pkgconfig
  - /share/man
  - /share/aclocal

modules:
  - name: xdotool
    buildsystem: simple
    build-commands:
      - "make -j${FLATPAK_BUILDER_N_JOBS} PREFIX=/app LDCONFIG=:"
      - "make PREFIX=/app LDCONFIG=: INSTALLMAN=/app/share/man install"
    sources:
      - type: archive
        url: https://github.com/jordansissel/xdotool/archive/refs/tags/v4.20260303.1.tar.gz
        sha256: c1f971a384da588eb99ca0755fc4300316d49c1e612537e3f1de52215e104fa3

  - name: xsel
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/kfish/xsel/archive/refs/tags/1.2.1.tar.gz
        sha256: 18487761f5ca626a036d65ef2db8ad9923bf61685e06e7533676c56d7d60eb14

  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      - -Dzshcompletiondir=no
      - -Dfishcompletiondir=no
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/refs/tags/v2.3.0.tar.gz
        sha256: b4dc560973f0cd74e02f817ffa2fd44ba645a4f1ea94b7b9614dacc9f895f402

  - name: wtype
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/atx/wtype/archive/refs/tags/v0.5.tar.gz
        sha256: 684308ac8b47c510dddf4abac3aef86b4f7b8c0e165389a40608679a7a5b77ed

  # ydotool injects input via /dev/uinput, the only active-window typing path on
  # wlroots/Hyprland inside the sandbox (wtype's virtual-keyboard protocol is
  # blocked by the Wayland security-context). The binary is bundled but needs no
  # device permission by default; users opt in with:
  #   flatpak override --user --device=all io.github.ashbuk.dabri
  # On GNOME/KDE the RemoteDesktop portal is used instead (no setup required).
  #
  # The patch drops the manpage (needs scdoc) and the systemd unit install
  # (absolute SD_UNITDIR outside /app); ydotoold itself is still built.
  - name: ydotool
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://github.com/ReimuNotMoe/ydotool/archive/refs/tags/v1.0.4.tar.gz
        sha256: ba075a43aa6ead51940e892ecffa4d0b8b40c241e4e2bc4bd9bd26b61fde23bd
      - type: patch
        path: packaging/flatpak/ydotool-drop-manpage-daemon.patch

  # SPIRV-Headers cmake config - required by whisper.cpp >= v1.8.5 Vulkan backend
  - name: spirv-headers
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/KhronosGroup/SPIRV-Headers/archive/refs/tags/vulkan-sdk-1.4.363.0.tar.gz
        sha256: 5b3a0d099f5c7649e29c0938476c462e71d66ad89a0bde42fa1ba3eb476956c9

  - name: whisper-cpp
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DWHISPER_BUILD_EXAMPLES=OFF
      - -DWHISPER_BUILD_TESTS=OFF
      - -DGGML_NATIVE=OFF
      - -DGGML_VULKAN=ON
      # Build every CPU variant as a module and pick the best one at runtime
      - -DGGML_BACKEND_DL=ON
      - -DGGML_CPU_ALL_VARIANTS=ON
      - -DGGML_BACKEND_DIR=/app/lib/ggml
    post-install:
      # The Go bindings link -lggml-cpu, which is a runtime module now
      - ar rcs /app/lib/libggml-cpu.a
    sources:
      - type: archive
        url: https://github.com/ggml-org/whisper.cpp/archive/refs/tags/v1.9.5.tar.gz
        sha256: ff1a9053feb509ff9d7729703355541ae9690073a6b1c40eb692c962e0dc1720

  # Bundle the default Whisper model so first run works offline
  - name: whisper-model-small
    buildsystem: simple
    build-commands:
      - install -Dm644 ggml-small-q5_1.bin /app/share/dabri/language-models/small-q5_1.bin
    sources:
      - type: file
        url: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
        sha256: ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb

  - name: dabri
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin
      env:
        CGO_ENABLED: "1"
        CGO_CFLAGS: -I/app/include
        CGO_LDFLAGS: -L/app/lib
    build-commands:
      - go build -mod=vendor -tags systray,gtk -trimpath -ldflags "-s -w -linkmode=external" -o dabri ./cmd/dabri
      - install -Dm755 dabri /app/bin/dabri
      - install -Dm755 packaging/flatpak/arecord /app/bin/arecord
      - install -Dm755 packaging/flatpak/notify-send /app/bin/notify-send
      - install -Dm644 io.github.ashbuk.dabri.desktop /app/share/applications/io.github.ashbuk.dabri.desktop
      - install -Dm644 io.github.ashbuk.dabri.appdata.xml /app/share/metainfo/io.github.ashbuk.dabri.metainfo.xml
      - install -Dm644 icons/io.github.ashbuk.dabri.png /app/share/icons/hicolor/128x128/apps/io.github.ashbuk.dabri.png
      - install -Dm644 icons/io.github.ashbuk.dabri.svg /app/share/icons/hicolor/scalable/apps/io.github.ashbuk.dabri.svg
    sources:
      - type: dir
        path: .
        skip:
          - .flatpak-builder
          - .git
          - build
          - dist
          - lib
          - logs
          - sources
          - tmp
      - packaging/flatpak/go.mod.yml
